</style></head><body><a class="skip" href="#view">Skip to page content</a><aside><div class="brand"><span class="brand-seal" aria-hidden="true">r.</span>RiskGuard<span> AI</span><small>RISK INTELLIGENCE / DEMO</small></div><nav class="nav" aria-label="Main navigation"><button data-page="dashboard"><b>01</b>Risk Dashboard</button><button data-page="trends"><b>02</b>Trend View</button><button data-page="alerts"><b>03</b>Alerts Center</button><button data-page="cases"><b>04</b>Case Management</button><button data-page="demographics"><b>05</b>Demographics</button><button data-page="explain"><b>06</b>Explainability</button><button data-page="solutions"><b>07</b>Mitigation Planner</button><button data-page="settings"><b>08</b>Settings / Admin</button><button data-page="audit"><b>09</b>Audit Trail</button><button data-page="quiz"><b>10</b>Class Quiz</button><button data-page="whatif"><b>11</b>What-if Lab</button><button data-page="agent"><b>12</b>AI Assistant</button></nav><div class="aside-bottom"><strong id="sessionCount">Session ready</strong>Session resets on refresh.</div></aside><main><div class="top"><p>AI-Powered Risk Prediction &amp; Mitigation</p><span class="badge">Simulated classroom demo</span></div><div id="view" tabindex="-1"></div></main><dialog id="detailDialog" aria-labelledby="dialogTitle"></dialog><div id="live" role="status" aria-live="polite" aria-atomic="true"></div><script>const riskDefs=[{id:'delay',name:'Project delay',weight:.29,evidence:['Only 30% of the project is complete.','25 days remain before launch.','Available team capacity is 48%.'],short:'Schedule and team capacity'},{id:'supply',name:'Supply chain',weight:.25,evidence:['Supplier reliability is rated low in this scenario.','No qualified backup supplier is available.'],short:'Supplier reliability'},{id:'financial',name:'Financial pressure',weight:.2,evidence:['76% of the budget is used against 30% completion.','The project budget is $920,000.'],short:'Budget use versus progress'},{id:'m rt rules changed.'],correct:3,why:['Logging a change does not change the underlying risk.','An audit record supports review rather than replacing it.','Historical actions should remain traceable.','Recorded settings changes explain why the same inputs may produce different priorities.']}];questions.push(...extraQuestions);

let serial=0,alertSerial=0,caseSerial=0;const stamp=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});function announce(t){$('#live').textContent='';setTimeout(()=>$('#live').textContent=t,20)}

const colors=['#c2bf91','#e8dfc5','#b9c3a5','#d9aaa8','#b9a6c2'];const offsets=[[-21,-18,-20,-14,-10,-12,-9,-6,-3,0],[-32,-25,-27,-18,-21,-13,-12,-9,-11,0],[-17,-15,-13,-16,-10,-7,-9,-5,-4,0],[-10,-8,-12,-6,-8,-4,-6,-3,-2,0],[-4,-2,-3,0,-2,1,-1,2,-2,0]];

cessible data table</summary><div class="table-wrap"><table><caption class="footnote">Illustrative category scores, 0–100</caption><thead><tr><th>Category</th>${Array.from({length:10},(_,i)=>`<th>P${i+1}</th>`).join('')}</tr></thead><tbody>${shown.map(r=>`<tr><td>${r.name}</td>${r.values.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details><p class="footnote">Periods are sequential teaching examples, not dates or historical measurements. A trend does not prove its cause.</p></section>`}

function signed(n){return n>0?'+'+n:String(n)}
function labResult(){const after=labRisks(),d=labDelta();return `<p class="eyebrow">SIMULATED OUTCOME</p><h2>Overall risk preview</h2><div class="comparison"><div><small>Current dashboard</small><strong>${total()}</strong></div><span aria-hidden="true">→</span><div><small>What-if preview</small><strong>${total(after)}</strong></div></div><p><strong>${signed(d)} points</strong> ${d<0?'lower':d>0?'higher':'change'} on the illustrative index.</p><div class="lab-rows">${after.map((r,i)=>`<div class="lab-row"><span>${r.name}</span><b>${risks()[i].score} → ${r.score} (${signed(r.score-risks()[i].score)})</b><div class="track"><div class="fill" style="width:${r.score}%"></div></div></div>`).join('')}</div><p class="footnote">Uses the active scenario and weights. Preview only; dashboard unchanged.</p><button class="btn" data-go="agent">Ask the assistant to explain →</button>`}
function whatif(){return heading('<button class="btn" id="resetLab">Reset support levels</button>')+`<div class="split"><section class="panel"><h2>What would you work on?</h2><p class="muted">50 = baseline. Move right for more support, left for less. Try one change first.</p>${controls.map((c,i)=>`<label class="slider-label" for="effort-${i}"><span>${effortNames[i]}</span><output id="effortValue-${i}">${state.effort[i]} / 100</output><input type="range" id="effort-${i}" data-effort="${i}" min="0" max="100" value="${state.effort[i]}" aria-describedby="effortHint-${i}"></label><p class="lab-hint" id="effortHint-${i}">${riskBy(c.risk).name}</p>`).join('')}<details style="margin-top:20px"><summary>How the classroom calculation works</summary><p class="footnote">Support is an invented index, not a measured resource or spending amount. Each slider starts at 50. Category score = scenario score − (support − 50) × maximum reduction ÷ 50, rounded and limited to 5–100. The combined index uses your normalized Settings weights.</p><ul>${controls.map((c,i)=>`<li>${effortNames[i]}: moving from 50 to 100 reduces ${riskBy(c.risk).name.toLowerCase()} by up to ${c.drop} points.</li>`).join('')}</ul><p class="footnote">These fixed teaching assumptions ignore interactions, costs and real-world uncertainty. Demographic attributes are not intervention inputs.</p></details></section><section class="panel lab-summary" id="labResult" aria-live="polite" aria-atomic="true">${labResult()}</section></div><div class="callout">A simulated improvement is not a promised outcome. Validate evidence and feasibility before choosing a real action. <button class="link" data-go="solutions">Build a mitigation plan →</button></div>`}
function agent(){return heading()+`<section class="panel"><div class="agent-mark" aria-hidden="true">✦</div><h2>Ask RiskGuard</h2><p class="muted">Simulated assistant · fixed rules, not a live AI model</p><div class="quick-prompts">${['Summarize risks','Recommend an action','Explain my what-if','Explain data quality'].map(t=>`<button class="btn" data-prompt="${t}">${t}</button>`).join('')}</div><div class="chat-thread" id="chatThread" role="log" aria-label="Assistant conversation" aria-live="polite" aria-relevant="additions">${state.chat.map(chatBubble).join('')}</div><form class="chat-form" id="chatForm"><label for="agentInput"><small>Ask about risk, mitigation, what-if, data quality, or cases</small><input id="agentInput" maxlength="300" placeholder="What should I work on first?" autocomplete="off" required></label><button class="btn primary" type="submit">Ask assistant</button></form><p class="footnote">Ask again after changing settings. The assistant suggests; you decide and act.</p></section>`}
function chatBubble(m){return `<div class="chat-message ${m.role==='user'?'user':''}"><strong>${m.role==='user'?'You':'RiskGuard · simulated assistant'}</strong>${esc(m.text)}</div>`}
function agentReply(input){const q=input.toLowerCase(),top=risks().reduce((a,b)=>a.score>b.score?a:b),sum=state.weights.reduce((a,b)=>a+b,0);if(/what.?if|slider|support|increase|decrease|impact|affected/.test(q)){const changed=controls.map((c,i)=>({c,i})).filter(x=>state.effort[x.i]!==50);return `Your current what-if preview is ${total(labRisks())}/100 versus ${total()}/100 on the dashboard: ${signed(labDelta())} points. ${changed.length?changed.map(({c,i})=>`${effortNames[i]} is ${state.effort[i]}/100; ${riskBy(c.risk).name} changes from ${riskBy(c.risk).score} to ${labRisks().find(r=>r.id===c.risk).score}.`).join(' '):'All support sliders are at the illustrative baseline of 50. Move one slider in What-if Lab to try a change.'} These are fixed simulated effects, not measured causal impacts.`}
if(/quality|bias|confidence|demograph/.test(q))return 'Inspect missing values, accuracy, sample coverage and group representation in Explainability and Demographics. A demographic pattern describes this sample; it does not establish a cause. No real model was trained or validated here, so the demo cannot establish predictive confidence.';
if(/case|escalat|alert/.test(q))return `There are ${state.alerts.filter(a=>a.status==='active').length} active demo alerts and ${state.cases.filter(c=>c.status!=='resolved').length} unresolved session cases. Review the evidence first. For a significant unresolved concern, create a case, assign a reviewer, and record the reason for escalation. Acknowledge an alert to record review; that does not resolve its risk.`;
if(/recommend|action|mitigat|first|work on|solution|reduce/.test(q)){const ranked=controls.map(c=>{const r=riskBy(c.risk),i=riskDefs.findIndex(r=>r.id===c.risk);return {c,r,drop:Math.min(c.drop,Math.max(0,r.score-5))*state.weights[i]/sum}}).sort((a,b)=>b.drop-a.drop),best=ranked[0];return `For the largest modeled reduction in the weighted index, consider “${best.c.name}”. Its isolated illustrative effect is about ${best.drop.toFixed(1)} overall points using current weights, before final rounding. Suggested owner: ${best.c.owner}. Explore its effect in What-if Lab, then assign it in the Mitigation Planner. This ranking ignores cost and feasibility; human review is required.`}
if(/risk|summar|score|priority|trend/.test(q))return `In ${scenarios[state.scenario].label}, the overall illustrative risk index is ${total()}/100. ${top.name} has the highest category score at ${top.score}/100. Inspect its evidence and contributing factors before acting. The index is not a probability of failure. Use What-if Lab to compare changes in support.`;
return 'I can explain the current risk scores, recommend a modeled mitigation, describe your what-if sliders, discuss data quality, or guide a case review. Try one of the suggested questions above. This offline, rule-based demo cannot answer general questions.'}
function askAgent(question){const q=question.trim().slice(0,300);if(!q)return;const messages=[{role:'user',text:q},{role:'assistant',text:agentReply(q)}];state.chat.push(...messages);$('#chatThread').insertAdjacentHTML('beforeend',messages.map(chatBubble).join(''));log('Assistant','Question answered',q);$('#agentInput').value='';$('#agentInput').focus();$('#chatThread').scrollTop=$('#chatThread').scrollHeight}
function bindExtensions(){document.querySelectorAll('[data-effort]').forEach(e=>{let before=+e.value;const i=+e.dataset.effort;e.oninput=()=>{state.effort[i]=+e.value;$('#effortValue-'+i).textContent=e.value+' / 100';$('#labResult').innerHTML=labResult()};e.onchange=()=>{if(before!==+e.value)log('What-if','Support adjusted',`${effortNames[i]}: ${before} to ${e.value}; preview ${total(labRisks())}/100`);before=+e.value}});if($('#resetLab'))$('#resetLab').onclick=()=>{state.effort=controls.map(()=>50);log('What-if','Support reset','All support levels restored to illustrative baseline 50');refreshFocus('#resetLab');announce('What-if support reset. Preview matches dashboard.')};document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>askAgent(b.dataset.prompt));if($('#chatForm'))$('#chatForm').onsubmit=e=>{e.preventDefault();askAgent($('#agentInput').value)}}

log('Session','Demo started','Illustrative data loaded. Session memory is local and resets on refresh.');thresholdAlerts('initial scenario');state.alerts.unshift({id:'ALT-'+String(++alertSerial).padStart(3,'0'),key:'sample-anomaly',risk:'fraud',title:'Unusual transaction pattern detected',message:'Sample TX-1055: repeated attempts and an amount above the usual customer range. Requires verification, not a fraud verdict.',severity:'high',scenario:scenarios[state.scenario].label,score:riskBy('fraud').score,time:stamp(),status:'active'});log('Alert','Anomaly alert triggered','Sample transaction TX-1055 flagged for human review');navigate('dashboard',false);
</script></body></html>
